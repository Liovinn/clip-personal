[package]
name = "osrender"
version = "0.1.0"
edition = "2021"
description = "Single-pass GPU renderer for OpenShorts vertical clips (NVDEC -> CUDA compositor -> NVENC)"
license = "MIT"
publish = false

[dependencies]
ffmpeg-sys-next = "7.1"
libloading = "0.8"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
