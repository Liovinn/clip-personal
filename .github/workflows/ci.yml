name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Everything the collected tests import at module level, WITHOUT the
      # heavy ML stack (torch/ultralytics/mediapipe/faster-whisper) — the
      # pipeline modules import those lazily behind their feature gates, and
      # the tests exercise the gated-off paths. numpy+opencv cover the layout
      # modules, fastapi/boto3/PyJWT/python-multipart cover importing app.py
      # for the MCP endpoint tests, google-genai covers gemini_worker.
      - name: Install test dependencies
        run: >
          pip install pytest pillow httpx pydantic sqlalchemy greenlet numpy
          opencv-python-headless python-dotenv google-genai fastapi boto3
          PyJWT email-validator python-multipart
      - name: Run tests
        run: pytest tests/ -v

  vast-python-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve the full Vast Python dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install --dry-run --ignore-installed \
            --extra-index-url https://download.pytorch.org/whl/cu128 \
            -c ops/vast/constraints.txt -r requirements.txt 'yt-dlp[default]'
      - name: Check language detection with the constrained NumPy version
        run: |
          python -m pip install -c ops/vast/constraints.txt numpy py3langid==0.2.2
          python - <<'PY'
          import numpy
          import py3langid
          assert numpy.__version__ == '1.26.4'
          for text, expected in [
              ('This video explains how to turn a long interview into short clips.', 'en'),
              ('Cette vidéo explique comment transformer un entretien en courtes vidéos.', 'fr'),
              ('Este vídeo explica cómo convertir una entrevista en vídeos cortos.', 'es'),
          ]:
              detected, _ = py3langid.classify(text)
              assert detected == expected, (text, detected)
          PY

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  vast-renderer-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Vast shell scripts
        run: |
          bash -n ops/vast/bootstrap.sh
          bash -n ops/vast/run-service.sh
          shellcheck ops/vast/bootstrap.sh ops/vast/run-service.sh
      - name: Install renderer and composition dependencies
        run: |
          npm ci --prefix render-service
          npm ci --prefix remotion
      - name: Check renderer build and metadata
        run: |
          npm run build --prefix render-service
          npm test --prefix render-service
      - name: Smoke test the bundled renderer
        env:
          HOST: "127.0.0.1"
          PORT: "3100"
        run: |
          cd render-service
          node dist/server.js > /tmp/openshorts-renderer.log 2>&1 &
          renderer_pid=$!
          trap 'kill "$renderer_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/health; then exit 0; fi
            if ! kill -0 "$renderer_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          cat /tmp/openshorts-renderer.log
          exit 1
